name: probe
on:
  push:
    branches: [ci/flutter-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          mkdir -p out && { flutter --version; dart --version; } > out/result.txt 2>&1
          cd out && git init -q && git checkout -q -b ci-logs && git add . && git -c user.name=ci -c user.email=ci@x commit -qm "probe ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
