name: MOTUS mobile apps

# Builds the two MOTUS apps (admin and driver) for Android (Google Play), Huawei (AppGallery) and
# iPhone on every push that touches mobile/. The APKs are published on the "mobile-latest" release
# page; every step's output is pushed to a ci-logs-<job>-<app> branch so problems can be read without
# the Actions UI.
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  MOTUS_URL: https://motus.sabeelbus.com

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, driver]
    env:
      APP_DIR: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android and iPhone project folders (created once, then kept in the repository)
        id: platforms
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p ../../out
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --org com.sabeel.motus --project-name motus_${{ matrix.app }} --platforms android,ios . > ../../out/create.txt 2>&1
            rm -f test/widget_test.dart
            python3 tool/configure_platforms.py . >> ../../out/create.txt 2>&1
            echo "created=1" >> "$GITHUB_OUTPUT"
          else
            python3 tool/configure_platforms.py . > ../../out/create.txt 2>&1
          fi
      - name: Keep the generated project folders in the repository
        if: steps.platforms.outputs.created == '1'
        run: |
          git config user.name "motus-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$APP_DIR/android" "$APP_DIR/ios" "$APP_DIR/.metadata" "$APP_DIR/.gitignore" 2>/dev/null || true
          git commit -m "Mobile (${{ matrix.app }}): Android and iPhone project folders (generated by flutter create, configured by tool/configure_platforms.py)" || true
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done || echo "push of generated folders failed" >> out/create.txt
      - name: Packages
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get 2>&1 | tee ../../out/pub.txt
      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos 2>&1 | tee ../../out/analyze.txt; exit ${PIPESTATUS[0]}
      - name: Tests
        working-directory: ${{ env.APP_DIR }}
        run: flutter test 2>&1 | tee ../../out/test.txt; exit ${PIPESTATUS[0]}
      - name: Build Android (Google Play, Firebase push)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --flavor google --dart-define=PUSH=fcm --dart-define=MOTUS_URL=$MOTUS_URL --dart-define=APP_VERSION=1.0.${{ github.run_number }} 2>&1 | tee ../../out/build-google.txt; exit ${PIPESTATUS[0]}
      - name: Build Android (Huawei AppGallery, Huawei Push Kit)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --flavor huawei --dart-define=PUSH=hms --dart-define=MOTUS_URL=$MOTUS_URL --dart-define=APP_VERSION=1.0.${{ github.run_number }} 2>&1 | tee ../../out/build-huawei.txt; exit ${PIPESTATUS[0]}
      - name: Name the APKs
        run: |
          mkdir -p dist
          cp $APP_DIR/build/app/outputs/flutter-apk/app-google-release.apk dist/MOTUS-${{ matrix.app }}-android.apk
          cp $APP_DIR/build/app/outputs/flutter-apk/app-huawei-release.apk dist/MOTUS-${{ matrix.app }}-huawei.apk
          ls -la dist > out/dist.txt
      - uses: actions/upload-artifact@v4
        with:
          name: motus-${{ matrix.app }}-android
          path: dist/*.apk
      - name: Download page (release "mobile-latest")
        if: github.ref_name == 'feature/mobile-apps' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: MOTUS apps (latest build)
          prerelease: true
          body: |
            Built from ${{ github.sha }} on ${{ github.ref_name }} (run ${{ github.run_number }}).
            - MOTUS-admin-android.apk / MOTUS-driver-android.apk: Android phones with Google services (Google Play builds)
            - MOTUS-admin-huawei.apk / MOTUS-driver-huawei.apk: Huawei phones without Google services (AppGallery builds)
            - iPhone: built without signing; install needs the Apple developer account (see mobile/README.md)
          files: dist/*.apk
      - name: Results to the ci-logs branch
        if: always()
        run: |
          mkdir -p out && cd out
          echo "{\"run\": ${{ github.run_number }}, \"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref_name }}\", \"job\": \"android\", \"app\": \"${{ matrix.app }}\", \"status\": \"${{ job.status }}\"}" > summary.json
          git init -q && git checkout -q -b ci-logs-android-${{ matrix.app }}
          git add . && git -c user.name=motus-ci -c user.email=ci@users.noreply.github.com commit -qm "android ${{ matrix.app }} run ${{ github.run_number }} ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-android-${{ matrix.app }}:ci-logs-android-${{ matrix.app }}

  ios:
    runs-on: macos-latest
    needs: android
    strategy:
      fail-fast: false
      matrix:
        app: [admin, driver]
    env:
      APP_DIR: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Project folders
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p ../../out
          if [ ! -d ios ]; then flutter create --org com.sabeel.motus --project-name motus_${{ matrix.app }} --platforms ios . > ../../out/create.txt 2>&1; rm -f test/widget_test.dart; fi
          python3 tool/configure_platforms.py . >> ../../out/create.txt 2>&1
      - name: Build iPhone (no signing)
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get > ../../out/pub.txt 2>&1
          flutter build ios --release --no-codesign --dart-define=PUSH=fcm --dart-define=MOTUS_URL=$MOTUS_URL --dart-define=APP_VERSION=1.0.${{ github.run_number }} 2>&1 | tee ../../out/build-ios.txt; exit ${PIPESTATUS[0]}
      - name: Package
        run: |
          mkdir -p dist
          cd $APP_DIR/build/ios/iphoneos && zip -qry ../../../../../dist/MOTUS-${{ matrix.app }}-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: motus-${{ matrix.app }}-ios-unsigned
          path: dist/*.zip
      - name: Results to the ci-logs branch
        if: always()
        run: |
          mkdir -p out && cd out
          echo "{\"run\": ${{ github.run_number }}, \"sha\": \"${{ github.sha }}\", \"job\": \"ios\", \"app\": \"${{ matrix.app }}\", \"status\": \"${{ job.status }}\"}" > summary.json
          git init -q && git checkout -q -b ci-logs-ios-${{ matrix.app }}
          git add . && git -c user.name=motus-ci -c user.email=ci@users.noreply.github.com commit -qm "ios ${{ matrix.app }} run ${{ github.run_number }} ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-ios-${{ matrix.app }}:ci-logs-ios-${{ matrix.app }}
